name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # One job per service, run in parallel. Each service's `test:all` covers
  # unit + mocked-integration + real-infra-integration (testcontainers).
  # ubuntu-latest ships with Docker Engine already running, so the
  # testcontainers-based tests execute for real here instead of
  # self-skipping the way they would on a Docker-less runner.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - bid-stream-consumer
          - cost-engine
          - valuation-service
          - anomaly-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Build (tsc --strict)
        working-directory: services/${{ matrix.service }}
        run: npm run build

      - name: Run unit + integration tests
        working-directory: services/${{ matrix.service }}
        run: npm run test:all

  # Frontend has no Docker dependency at all - pure formula/DOM-mapping
  # logic extracted into calc.js, run under vitest. Runs in parallel with
  # the service matrix above.
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # Full-stack smoke test: builds and boots all 8 containers via the real
  # docker-compose.yml, waits on the healthchecks already defined there
  # (compose v2's --wait honors each service's `healthcheck:` block, so
  # this doesn't need a hand-rolled polling loop), then runs the actual
  # bid -> Kafka -> recompute -> WebSocket smoke test against it.
  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run e2e smoke test
        working-directory: test/e2e
        run: |
          npm ci
          npm test

      - name: Dump service logs (on failure)
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 5

      - name: Tear down
        if: always()
        run: docker compose down -v
